services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: akvo-rag-js
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    command: npm run dev
